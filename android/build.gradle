buildscript {
    ext.kotlin_version = '1.9.25'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// External volumes (ExFAT) store macOS provenance as AppleDouble `._*`
// files, which makes AAPT fail release resource linking. Point
// ANDROID_BUILD_DIR at an APFS directory to build off that volume.
def androidBuildDir = findProperty('androidBuildDir') ?: System.getenv('ANDROID_BUILD_DIR')
if (androidBuildDir != null && !androidBuildDir.trim().isEmpty()) {
    rootProject.buildDir = androidBuildDir
} else {
    rootProject.buildDir = '../build'
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// ExFAT/Seagate volumes create macOS AppleDouble `._*` sidecars that break AAPT.
subprojects { proj ->
    proj.tasks.configureEach { task ->
        def n = task.name.toLowerCase()
        if (n.contains('resource') || n.contains('aapt') || n.contains('merge') || n.contains('package')) {
            task.doFirst {
                def dir = proj.buildDir
                if (dir != null && dir.exists()) {
                    dir.eachFileRecurse { f ->
                        if (f.isFile() && f.name.startsWith('._')) {
                            f.delete()
                        }
                    }
                }
            }
        }
    }
}
subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.support'
                    && !details.requested.name.contains('multidex') ) {
                details.useVersion "26.1.0"
            }
        }
    }
}


// Fix for AGP builds failing with:
// "defaultConfig contains custom BuildConfig fields, but the feature is disabled."
// This can happen inside Flutter plugin modules like `:firebase_core`.
//
// Use plugin callbacks (safe at configuration-time) instead of `afterEvaluate`
// to avoid: "Cannot run Project.afterEvaluate(...) when the project is already evaluated."
subprojects { proj ->
    proj.plugins.withId('com.android.application') {
        proj.android.buildFeatures.buildConfig = true
    }
    proj.plugins.withId('com.android.library') {
        proj.android.buildFeatures.buildConfig = true
        // AGP8+ requires `namespace` for every android module.
        // Some older Flutter plugins don't set it; their AndroidManifest.xml still has
        // the deprecated `package="..."` attribute, so we copy that into `namespace`.
        try {
            def currentNamespace = proj.android.namespace
            if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                def manifestFile = proj.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifest = new XmlSlurper().parse(manifestFile)
                    def pkg = manifest.@package?.toString()
                    if (pkg != null && !pkg.trim().isEmpty()) {
                        proj.android.namespace = pkg.trim()
                    }
                }
            }
        } catch (ignored) {
            // If manifest doesn't exist or namespace is already set, do nothing.
        }
    }
}
